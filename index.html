<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaan Bhimani | Software Engineering Student</title>
<meta name="description" content="Portfolio of Ayaan Bhimani, Software Engineering student at the University of Waterloo.">

<meta property="og:type" content="website">
<meta property="og:title" content="Ayaan Bhimani | Software Engineering Student">
<meta property="og:description" content="Portfolio of Ayaan Bhimani, Software Engineering student at the University of Waterloo.">
<meta property="og:url" content="https://a-nature.github.io/ayaanbhimani.github.io/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Ayaan Bhimani | Software Engineering Student">
<meta name="twitter:description" content="Portfolio of Ayaan Bhimani, Software Engineering student at the University of Waterloo.">

<!-- "AB" monogram on a terracotta tile -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E0854F'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Consolas,Menlo,monospace' font-size='17' font-weight='800' fill='%2314100B'%3EAB%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=27">
</head>
<body>

<!-- =======================================================================
     Boid-flock background — fixed behind the whole page, but only visible
     in the Hero, the one section without an opaque background of its own
     (the dusk sky is the Hero's ::before). See css/style.css and js/boids.js.
     ======================================================================= -->
<canvas id="boid-canvas" aria-hidden="true"></canvas>
<div class="site-bg-fallback" id="site-bg-fallback" aria-hidden="true"></div>

<!-- =======================================================================
     Nav
     ======================================================================= -->
<nav class="site-nav" id="site-nav">
  <div class="container">
    <div class="nav-links" id="nav-links">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#education">Education</a>
      <a href="#contact">Contact</a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</nav>

<!-- =======================================================================
     Hero
     ======================================================================= -->
<header class="hero" id="top">
  <div class="container">
    <h1 id="hero-name"></h1>
    <p class="hero-subtitle" id="hero-subtitle"></p>
    <p class="hero-location" id="hero-location"></p>
    <div class="hero-actions">
      <a href="#projects" class="btn btn-primary">View Projects</a>
      <a href="#contact" class="btn">Get in Touch</a>
      <a href="#" class="btn" id="hero-resume-link" target="_blank" rel="noopener noreferrer">Resume</a>
    </div>
  </div>
</header>

<!-- =======================================================================
     About
     ======================================================================= -->
<section class="about" id="about">
  <div class="container">
    <div class="about-content">
      <span class="section-label">About Me</span>
      <h2 class="section-heading">My Backstory</h2>
      <div class="about-bio" id="about-bio"></div>
    </div>
  </div>
  <!-- Far-off volcanoes behind the hills, with an ash plume at the main crater -->
  <svg class="about-volcanoes" viewBox="0 -60 1440 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="cone-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4A3533"/>
        <stop offset="1" stop-color="#2A1D1C"/>
      </linearGradient>
      <filter id="ash-blur" filterUnits="userSpaceOnUse" x="800" y="-60" width="400" height="260">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>
    <g fill="#5A4548" opacity="0.42" filter="url(#ash-blur)">
      <circle cx="902" cy="146" r="12"/>
      <circle cx="912" cy="122" r="17"/>
      <circle cx="930" cy="96" r="24"/>
      <circle cx="960" cy="70" r="32"/>
      <circle cx="1002" cy="48" r="40"/>
      <circle cx="1054" cy="34" r="46"/>
    </g>
    <g fill="url(#cone-fill)" opacity="0.92">
      <path d="M60,300 C150,296 200,262 238,226 L256,208 Q270,213 284,208 L302,226 C340,262 400,296 480,300 Z"/>
      <path d="M730,300 C800,292 850,230 880,180 L890,164 Q902,170 914,164 L924,180 C954,230 1010,292 1090,300 Z"/>
      <path d="M1150,300 C1200,296 1240,276 1268,246 L1282,232 Q1294,236 1306,232 L1320,246 C1348,276 1390,296 1440,300 Z"/>
    </g>
    <path d="M908,168 L912,190 L906,206 L914,230 L909,252" fill="none" stroke="#E0854F" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
  </svg>
  <!-- Layered hill silhouette, dusk sky fading into the ground below -->
  <svg class="about-horizon" viewBox="0 0 1440 160" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,90 L120,70 L260,95 L420,60 L600,85 L800,55 L980,80 L1180,50 L1320,75 L1440,60 L1440,160 L0,160 Z" fill="#8B5A42" opacity="0.55"/>
    <path d="M0,115 L160,95 L340,120 L520,90 L700,110 L900,85 L1100,105 L1300,80 L1440,100 L1440,160 L0,160 Z" fill="#4A332A" opacity="0.8"/>
    <path d="M0,140 L200,125 L400,140 L650,120 L900,138 L1150,118 L1440,135 L1440,160 L0,160 Z" fill="#241A13"/>
  </svg>
</section>

<!-- =======================================================================
     Projects — icon grid, opens shared window modal
     ======================================================================= -->
<section class="projects" id="projects">
  <div class="projects-heading">
    <div class="container">
      <h2 class="section-heading">Projects</h2>
    </div>
  </div>
  <!-- Filled with one full-width .project-layer band per stratum (see
       renderProjects() in main.js), each with its own inner .container
       so the cards line up with the rest of the page. -->
  <div id="project-grid"></div>
</section>

<!-- =======================================================================
     Experience — tabs + vertical timeline, opens shared window modal
     ======================================================================= -->
<section class="experience" id="experience">
  <div class="container">
    <h2 class="section-heading">Museum of My Experience</h2>
    <div class="exp-tabs" id="exp-tabs" role="tablist"></div>
    <div class="timeline" id="exp-timeline"></div>
  </div>
</section>

<!-- =======================================================================
     Skills
     ======================================================================= -->
<section class="skills" id="skills">
  <div class="container">
    <h2 class="section-heading">Skills</h2>
    <div class="skills-groups" id="skills-groups"></div>
  </div>
</section>

<!-- =======================================================================
     Education — short, no modal needed
     ======================================================================= -->
<section class="education" id="education">
  <div class="container">
    <h2 class="section-heading">Education</h2>
    <div class="education-list" id="education-list"></div>
  </div>
</section>

<!-- =======================================================================
     Contact
     ======================================================================= -->
<section class="contact" id="contact">
  <div class="container contact-inner">
    <span class="section-label">Contact</span>
    <h2 class="section-heading">Let's talk</h2>
    <p>Reach out about co-ops, collaborations, or just to say hi.</p>
    <div class="contact-links" id="contact-links"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <!-- Bird skull, a small closing nod to "birds are living dinosaurs" -->
    <svg class="footer-mark" viewBox="0 0 48 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 10c0-4.5 4-8 10-8s10 3 10 7c0 2.5-1.5 4-3 5l9 2.5-9 2c1 1.5 1.5 3 .5 4.5-1.5 2-5 2-7-0.5"/>
      <path d="M14 10c-5 0-9 2.5-9 6 0 2.5 2 4 4.5 4.5"/>
      <circle cx="21" cy="11" r="1.4" fill="currentColor" stroke="none"/>
    </svg>
    &copy; <span id="footer-year"></span> Ayaan Bhimani
  </div>
</footer>

<!-- =======================================================================
     Shared "window" modal — reused by Projects and Experience
     ======================================================================= -->
<div class="window-overlay" id="window-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="window-title-text">
  <div class="window-modal">
    <div class="window-titlebar">
      <span class="window-title"><span id="window-title-text"></span></span>
      <button class="window-close" id="window-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="window-body" id="window-body"></div>
  </div>
</div>

<!-- =======================================================================
     Media lightbox — reuses the window-modal titlebar/chrome. Stacks above
     the window-overlay above when opened from inside a project/experience
     modal. See js/lightbox.js.
     ======================================================================= -->
<div class="window-overlay" id="lightbox-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lightbox-title-text">
  <div class="window-modal lightbox-modal">
    <div class="window-titlebar">
      <span class="window-title"><span id="lightbox-title-text"></span></span>
      <div class="lightbox-titlebar-right">
        <span id="lightbox-titlebar-actions" class="lightbox-titlebar-actions"></span>
        <button class="window-close" id="lightbox-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="lightbox-body" id="lightbox-body"></div>
    <button class="lightbox-arrow lightbox-arrow-prev" id="lightbox-prev" aria-label="Previous" hidden></button>
    <button class="lightbox-arrow lightbox-arrow-next" id="lightbox-next" aria-label="Next" hidden></button>
  </div>
</div>

<script src="js/data.js?v=27"></script>
<script src="js/icons.js?v=27"></script>
<script src="js/boids.js?v=27"></script>
<script src="js/lightbox.js?v=27"></script>
<script src="js/fossils.js?v=27"></script>
<script src="js/main.js?v=27"></script>
</body>
</html>
