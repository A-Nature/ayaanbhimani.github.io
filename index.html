<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaan Bhimani | Software Engineering Student</title>
<meta name="description" content="Portfolio of Ayaan Bhimani, Software Engineering student at the University of Waterloo.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>

<!-- =======================================================================
     Sky + ambient boid-flock background — fixed behind the whole page, but
     only visible where a section doesn't paint its own opaque background
     (Hero and About). See css/style.css and js/boids.js.
     ======================================================================= -->
<div id="sky-gradient" aria-hidden="true"></div>
<canvas id="boid-canvas" aria-hidden="true"></canvas>
<div class="site-bg-fallback" id="site-bg-fallback" aria-hidden="true"></div>

<!-- =======================================================================
     Nav
     ======================================================================= -->
<nav class="site-nav" id="site-nav">
  <div class="container">
    <div class="nav-links" id="nav-links">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#education">Education</a>
      <a href="#contact">Contact</a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</nav>

<!-- =======================================================================
     Hero
     ======================================================================= -->
<header class="hero" id="top">
  <div class="container">
    <h1 id="hero-name"></h1>
    <p class="hero-subtitle" id="hero-subtitle"></p>
    <p class="hero-location" id="hero-location"></p>
    <div class="hero-actions">
      <a href="#projects" class="btn btn-primary">View Projects</a>
      <a href="#contact" class="btn">Get in Touch</a>
      <a href="#" class="btn" id="hero-resume-link" download>Resume</a>
    </div>
  </div>
</header>

<!-- =======================================================================
     About
     ======================================================================= -->
<section class="about" id="about">
  <div class="container">
    <div class="about-content">
      <span class="section-label">About Me</span>
      <h2 class="section-heading">My Backstory</h2>
      <div class="about-bio" id="about-bio"></div>
    </div>
  </div>
  <!-- Layered hill silhouette, dusk sky fading into the ground below -->
  <svg class="about-horizon" viewBox="0 0 1440 160" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,90 L120,70 L260,95 L420,60 L600,85 L800,55 L980,80 L1180,50 L1320,75 L1440,60 L1440,160 L0,160 Z" fill="#8B5A42" opacity="0.55"/>
    <path d="M0,115 L160,95 L340,120 L520,90 L700,110 L900,85 L1100,105 L1300,80 L1440,100 L1440,160 L0,160 Z" fill="#4A332A" opacity="0.8"/>
    <path d="M0,140 L200,125 L400,140 L650,120 L900,138 L1150,118 L1440,135 L1440,160 L0,160 Z" fill="#0D1117"/>
  </svg>
</section>

<!-- =======================================================================
     Projects — icon grid, opens shared window modal
     ======================================================================= -->
<section class="projects" id="projects">
  <div class="container">
    <span class="section-label">Projects</span>
    <div class="project-grid" id="project-grid"></div>
  </div>
</section>

<!-- =======================================================================
     Experience — tabs + vertical timeline, opens shared window modal
     ======================================================================= -->
<section class="experience" id="experience">
  <div class="container">
    <h2 class="section-heading">My Experience</h2>
    <div class="exp-tabs" id="exp-tabs" role="tablist"></div>
    <div class="timeline" id="exp-timeline"></div>
  </div>
</section>

<!-- =======================================================================
     Skills
     ======================================================================= -->
<section class="skills" id="skills">
  <div class="container">
    <h2 class="section-heading">Skills</h2>
    <div class="skills-groups" id="skills-groups"></div>
  </div>
</section>

<!-- =======================================================================
     Education — short, no modal needed
     ======================================================================= -->
<section class="education" id="education">
  <div class="container">
    <h2 class="section-heading">Education</h2>
    <div class="education-list" id="education-list"></div>
  </div>
</section>

<!-- =======================================================================
     Contact
     ======================================================================= -->
<section class="contact" id="contact">
  <div class="container contact-inner">
    <span class="section-label">Contact</span>
    <h2 class="section-heading">Let's talk</h2>
    <p>Reach out about co-ops, collaborations, or just to say hi.</p>
    <div class="contact-links" id="contact-links"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    &copy; <span id="footer-year"></span> Ayaan Bhimani
  </div>
</footer>

<!-- =======================================================================
     Shared "window" modal — reused by Projects and Experience
     ======================================================================= -->
<div class="window-overlay" id="window-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="window-title-text">
  <div class="window-modal">
    <div class="window-titlebar">
      <span class="window-title"><span class="dot"></span><span id="window-title-text"></span></span>
      <button class="window-close" id="window-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="window-body" id="window-body"></div>
  </div>
</div>

<script src="js/data.js?v=13"></script>
<script src="js/icons.js?v=13"></script>
<script src="js/boids.js?v=13"></script>
<script src="js/main.js?v=13"></script>
</body>
</html>
